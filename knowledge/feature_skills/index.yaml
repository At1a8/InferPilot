# feature_skills selector registry. One entry per skill; keep in sync with each SKILL.md frontmatter.
# Find candidates by tag (scripts/find_skill.py "<request>"), then filter them by match (framework,
# feature, model_arch, platforms) and status, then read the skill. validated skills are high-prior
# plans; stale ones are references to re-verify step by step.
# tags: English words a task about the feature may use — its name and aliases, the algorithm or
# subsystem it belongs to, the techniques it is built on; not the model or platform (match holds those).

schema: {id, file, tags, match, depends_on, validation_status}

skills:
- id: hisparse-v2
  file: hisparse-v2/SKILL.md
  tags: [hisparse, sparse attention, hierarchical cache, hicache, kv cache offload, host memory tier, kv swap-in, long context]
  match:
    framework: sglang
    framework_ref: b057d5b3f1
    feature: hisparse_v2
    model_arch: [deepseek_v4]      # DeepSeek-V4 / V4.1 compressed KV (compression ratios 1 and 2)
    platforms: [rocm-gfx950]
  depends_on: [sgl-project/sglang#32314]
  validation_status: validated
- id: fly-dspark
  file: fly-dspark/SKILL.md
  match:
    framework: sglang
    framework_ref: 58241600c5
    feature: fly_speculative_verification
    model_arch: [deepseek_v4]      # DeepSeek-V4.1-Flash with its bundled DSPARK block drafter (gamma 5)
    platforms: [rocm-gfx950]
  depends_on: [vllm-project/vllm#53987, vllm-project/vllm#66593]
  validation_status: validated     # gates G0, G1, G2, G5; G3 / G4 not claimed
