# Every pull request and every push to main runs tests/run_all.sh on GitHub's runners: offline, no GPU,
# no secrets. Once with the oldest Python and Node.js InferPilot supports (a host's), once with the newest
# (the container's Python, the Node.js LTS bootstrap --runner installs).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python }}, Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            node: '20'
          - python: '3.12'
            node: 'lts/*'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: tests/run_all.sh
