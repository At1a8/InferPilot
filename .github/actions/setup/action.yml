name: setup
description: The Python and Node.js the tests run with (by default the newest InferPilot supports)
inputs:
  python:
    description: Python version
    default: '3.12'
  node:
    description: Node.js version
    default: lts/*
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python }}
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node }}
